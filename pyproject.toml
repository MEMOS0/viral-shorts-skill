[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-shorts-skill"
version = "0.2.0"
description = "Production gates and MCP server for high-retention story Shorts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "mcp>=1.0,<2",
  "numpy>=1.24",
  "Pillow>=10.0",
  "yt-dlp>=2024.10.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
whisper = ["openai-whisper>=20231117"]

[project.scripts]
viral-shorts-mcp = "tools.mcp_server:main"

[tool.setuptools]
packages = ["tools"]
