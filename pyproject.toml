[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-shorts-skill"
version = "0.2.0"
description = "Production gates and MCP server for high-retention story Shorts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "mcp>=1.0,<2",
  "numpy>=1.24",
  "Pillow>=10.0",
  "yt-dlp>=2024.10.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
whisper = ["openai-whisper>=20231117"]

[project.scripts]
viral-shorts-mcp = "tools.mcp_server:main"

[tool.setuptools]
packages = ["tools"]

[tool.setuptools.data-files]
"viral-shorts-skill" = ["README.md", "SKILL.md", "AGENTS.md", "ALL_IN_ONE.md"]
"viral-shorts-skill/references" = ["references/*.md"]
"viral-shorts-skill/data" = ["data/*.md", "data/*.json", "data/*.csv"]
"viral-shorts-skill/schemas" = ["schemas/*.json"]
"viral-shorts-skill/templates" = ["templates/*"]
"viral-shorts-skill/examples" = ["examples/*"]
